<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>教程：如何描述，让 AI 做出动态文字视频</title>
<style>
@font-face{font-family:'SC';src:url(fonts/nsc-400.ttf);font-weight:400}
@font-face{font-family:'SC';src:url(fonts/nsc-500.ttf);font-weight:500}
@font-face{font-family:'SC';src:url(fonts/nsc-700.ttf);font-weight:700}
@font-face{font-family:'Mont';src:url(fonts/mont-800.ttf);font-weight:800}
@font-face{font-family:'Mont';src:url(fonts/mont-900.ttf);font-weight:900}
:root{--bg:#0a0a12;--pn:#151522;--ln:#262638;--tx:#f2f2f7;--dim:#8b8ba3;--blue:#3d1cff;--yel:#efff0c;--grn:#39ff88;--red:#ff4d6d;--mag:#ff2bd6}
html,body{margin:0;background:#000;overflow:hidden}
#v{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font:500 34px SC,sans-serif;color:var(--tx)}
.seg{position:absolute;inset:0;display:none}
.abs{position:absolute}
.h1{font:700 76px SC;letter-spacing:.01em}
.h2{font:700 56px SC}
.en{font-family:Mont,SC;font-weight:900}
.dim{color:var(--dim)}
.pn{position:absolute;background:var(--pn);border:1px solid var(--ln);border-radius:18px}
.clip{position:absolute;overflow:hidden;border-radius:14px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.clip img{position:absolute;left:0;top:0;width:100%;height:100%}
.lbl{position:absolute;left:16px;top:14px;font:700 22px SC;padding:4px 12px;border-radius:8px;background:rgba(0,0,0,.6)}
.chip{display:inline-block;padding:6px 16px;border-radius:999px;font:700 26px SC}
.prompt{position:absolute;background:#10101a;border:1px solid #33334a;border-radius:16px;padding:22px 28px;box-sizing:border-box;font:500 28px/1.6 SC;color:#e8e8f0}
.prompt .hd{font:700 20px SC;color:var(--dim);margin-bottom:8px;letter-spacing:.08em}
.caret{display:inline-block;width:14px;height:30px;background:var(--yel);vertical-align:-5px;margin-left:3px}
#cap{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);max-width:1500px;text-align:center;font:700 40px/1.45 SC;color:#fff;
  padding:12px 30px;border-radius:14px;background:rgba(8,8,14,.72);z-index:50;white-space:nowrap}
#prog{position:absolute;left:0;top:0;height:6px;background:var(--yel);z-index:60}
#chap{position:absolute;left:40px;top:30px;font:700 22px SC;color:var(--dim);z-index:60;letter-spacing:.06em}
.tile{position:absolute;width:420px;height:300px;border-radius:16px;overflow:hidden;background:#000}
.tile img{position:absolute;left:0;top:0;width:100%;height:236px;object-fit:cover}
.tile b{position:absolute;left:0;right:0;bottom:0;height:64px;line-height:64px;padding-left:20px;background:#151522;font:700 28px SC}
.blk{position:absolute;width:520px;height:200px;border-radius:20px;background:var(--pn);border:1px solid var(--ln);padding:26px 30px;box-sizing:border-box}
.blk .n{font:900 56px Mont;color:var(--yel)}
.blk .t{font:700 44px SC;margin-top:4px}
.blk .s{font:500 26px SC;color:var(--dim);margin-top:2px}
.chk{display:flex;align-items:center;gap:22px;font:700 40px SC;height:96px}
.chk i{width:52px;height:52px;border-radius:12px;border:3px solid #44445c;display:flex;align-items:center;justify-content:center;font-style:normal;color:#0a0a12;font-size:36px}
del{color:var(--red);text-decoration-thickness:3px}
</style>
</head>
<body>
<div id="v">
  <div id="prog"></div><div id="chap"></div>
  <div id="cap"></div>
</div>
<script src="tut.js"></script>
</body>
</html>
