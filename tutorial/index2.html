<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>教程 v2</title>
<style>
@font-face{font-family:'SC';src:url(fonts/nsc-400.ttf);font-weight:400}
@font-face{font-family:'SC';src:url(fonts/nsc-500.ttf);font-weight:500}
@font-face{font-family:'SC';src:url(fonts/nsc-700.ttf);font-weight:700}
@font-face{font-family:'Mont';src:url(fonts/mont-800.ttf);font-weight:800}
@font-face{font-family:'Mont';src:url(fonts/mont-900.ttf);font-weight:900}
:root{--bg:#0a0a12;--pn:#151522;--ln:#262638;--tx:#f2f2f7;--dim:#8b8ba3;--blue:#3d1cff;--yel:#efff0c;--grn:#39ff88;--red:#ff4d6d}
html,body{margin:0;background:#000;overflow:hidden}
#v{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font:500 34px SC,sans-serif;color:var(--tx)}
#glow{position:absolute;inset:0;background:radial-gradient(900px 600px at 78% 45%,rgba(61,28,255,.22),transparent 70%)}
.seg{position:absolute;inset:0;display:none}
.abs{position:absolute}
#left{position:absolute;left:96px;top:0;width:780px;height:1080px;z-index:5}
.ln{position:absolute;left:0;font:700 64px/1.25 SC;white-space:nowrap;letter-spacing:.01em}
.ln.s{font:500 36px/1.4 SC;color:var(--dim)}
.y{color:var(--yel)}
.media{position:absolute;overflow:hidden;border-radius:16px;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
.media img{position:absolute;left:0;top:0;width:100%;height:100%}
.tagl{position:absolute;left:16px;top:14px;font:700 22px SC;padding:4px 12px;border-radius:8px;background:rgba(0,0,0,.65);z-index:3}
.doc{position:absolute;left:0;width:780px;background:#11111c;border:1px solid #2c2c42;border-radius:16px;padding:22px 26px;box-sizing:border-box;font:500 30px/1.65 SC;color:#d9d9e6}
.doc .hd{font:700 20px SC;color:var(--dim);letter-spacing:.1em;margin-bottom:6px}
.hl{background:linear-gradient(transparent 55%,rgba(239,255,12,.45) 55%) no-repeat;background-size:0% 100%;color:#fff}
.num{font:900 40px Mont;color:var(--yel);letter-spacing:.06em}
.tile{position:absolute;width:232px;height:176px;border-radius:12px;overflow:hidden;background:#000}
.tile img{position:absolute;left:0;top:0;width:100%;height:131px;object-fit:cover}
.tile b{position:absolute;left:0;right:0;bottom:0;height:45px;line-height:45px;padding-left:12px;background:#151522;font:700 21px SC;white-space:nowrap}
.data{position:absolute;overflow:hidden;border-radius:16px;background:#0d0d16;border:1px solid #2c2c42;font:500 19px/1.55 'JetBrains Mono',monospace;color:#9fe8b8;padding:18px 22px;box-sizing:border-box}
#cap{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);font:700 40px SC;color:#fff;padding:12px 30px;border-radius:14px;background:rgba(8,8,14,.72);z-index:50;white-space:nowrap;display:none}
#chap{position:absolute;left:96px;top:60px;font:700 22px SC;color:var(--dim);z-index:60;letter-spacing:.08em}
#prog{position:absolute;left:0;top:0;height:6px;background:var(--yel);z-index:60}
</style>
</head>
<body>
<div id="v"><div id="glow"></div><div id="left"></div><div id="prog"></div><div id="chap"></div><div id="cap"></div></div>
<script src="bbox.js"></script>
<script src="tut2.js"></script>
</body>
</html>
