<!doctype html>
<html><head><meta charset="utf-8"><title>封面 · 简洁</title>
<style>
@font-face{font-family:NotoSerifSC;src:url(../src/fonts/serif-900.ttf);font-weight:900}
html,body{margin:0;background:#000;overflow:hidden}
canvas,#txt{position:absolute;left:0;top:0;width:1080px;height:1920px}
.t{position:absolute;left:0;right:0;text-align:center;white-space:nowrap}
#title{top:820px;font:900 230px NotoSerifSC;letter-spacing:.04em;color:#F4D57E;
  text-shadow:0 0 18px rgba(244,200,100,.55),0 0 60px rgba(244,190,90,.35),0 0 140px rgba(244,180,80,.18)}
#dot{display:inline-block;width:26px;height:26px;border-radius:50%;background:#E8423A;vertical-align:middle;margin-left:28px;position:relative;top:-6px;
  box-shadow:0 0 14px rgba(232,66,58,.6)}
#en{top:1175px;font:500 40px 'JetBrains Mono',monospace;letter-spacing:.62em;color:#C9A866;padding-left:.62em}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<div id="txt">
  <div id="title" class="t">向前走<span id="dot"></span></div>
  <div id="en" class="t">MOVE FORWARD</div>
</div>
<script>
const g = document.getElementById('c').getContext('2d'), W = 1080, H = 1920, HZ = 1290, VX = W / 2;
// background: near-black with a faint warm glow behind the title
g.fillStyle = '#050504'; g.fillRect(0, 0, W, H);
const glow = g.createRadialGradient(VX, 960, 0, VX, 960, 900);
glow.addColorStop(0, 'rgba(60,46,22,0.55)'); glow.addColorStop(0.5, 'rgba(30,24,12,0.25)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
g.fillStyle = glow; g.fillRect(0, 0, W, H);
// perspective grid floor, fading into the horizon
g.save(); g.beginPath(); g.rect(0, HZ, W, H - HZ); g.clip();
for (let k = -40; k <= 40; k++) {                       // lines converging on the vanishing point
  const xb = VX + k * 120; g.strokeStyle = `rgba(205,165,95,${k === 0 ? 0.36 : 0.24})`; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(VX + (xb - VX) * 0.02, HZ); g.lineTo(VX + (xb - VX) * 2.2, H); g.stroke();
}
for (let k = 1; k < 60; k++) {                          // horizontal lines, closer together near the horizon
  const y = HZ + Math.pow(k / 60, 2.2) * (H - HZ) * 1.6; if (y > H) break;
  g.strokeStyle = 'rgba(205,165,95,0.22)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
}
const fade = g.createLinearGradient(0, HZ, 0, HZ + 260); fade.addColorStop(0, 'rgba(5,5,4,1)'); fade.addColorStop(1, 'rgba(5,5,4,0)');
g.fillStyle = fade; g.fillRect(0, HZ, W, 260);
const bot = g.createLinearGradient(0, H - 300, 0, H); bot.addColorStop(0, 'rgba(0,0,0,0)'); bot.addColorStop(1, 'rgba(0,0,0,0.6)');
g.fillStyle = bot; g.fillRect(0, H - 300, W, 300);
g.restore();
// soft vignette
const v = g.createRadialGradient(VX, H * 0.5, 400, VX, H * 0.5, 1300); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.65)');
g.fillStyle = v; g.fillRect(0, 0, W, H);
window.ready = document.fonts.load('900 100px NotoSerifSC', '向前走').then(() => document.fonts.ready).then(() => true);
</script></body></html>
