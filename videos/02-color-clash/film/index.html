<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Color Clash</title>
<style>
@font-face{font-family:'Mont';src:url(fonts/mont-500.ttf);font-weight:500}
@font-face{font-family:'Mont';src:url(fonts/mont-800.ttf);font-weight:800}
@font-face{font-family:'Mont';src:url(fonts/mont-900.ttf);font-weight:900}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block;width:1920px;height:1080px}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
window.ready = Promise.all(['500', '800', '900'].map(w => document.fonts.load(w + ' 40px Mont'))).then(() => new Promise(res => {
  const s = document.createElement('script'); s.src = 'clash.js'; s.onload = () => res(true); document.body.appendChild(s);
}));
</script>
</body>
</html>
